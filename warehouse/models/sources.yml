version: 2

sources:
  - name: raw
    database: effen-growth-prod
    schema: raw
    description: Airbyte-landed tables. Never hand-edited (ADR-0003).
    # Meta tables are PER-ACCOUNT (raw.meta_<account_key>_<stream>) and
    # auto-discovered by the union_meta_stream macro — they are not
    # declared here.
    tables:
      - name: supabase_orders_read
        description: Fullkit orders read-model, incremental on synced_at.
      - name: supabase_ad_accounts_read
        description: EFFEN ad-account register incl. brand/market mapping (ADR-0003 open item 3 — mapping is governed in Fullkit, published here).
      - name: supabase_ad_daily_facts
        description: Interim connector-seeded daily facts; superseded by mart_ads_daily once the Meta pipeline is validated.
      - name: supabase_nv_shipments
      - name: supabase_brands
